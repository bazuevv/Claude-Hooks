# ==== Диагностика и безопасный режим ====

# Безопасный режим: оставить в webview только базовый модуль.
#
# true  — гасятся ВСЕ модули claude-custom.js (session mover, эмодзи,
#         кнопки футера, keepalive, Mood, поиск по странице, цитаты).
#         Остаётся база: метка времени, ping, debug-оверлей — ровно то,
#         что крутится в проектах, где расширение ни разу не ломалось.
# false — модули работают по своим флагам ниже.
#
# Зачем: 2026-09-01 вкладки расширения перестали показывать содержимое
# при целом бандле (код приложения байт в байт совпадал с эталоном,
# наш JS исполнялся, протокол webview работал). Единственным отличием
# от рабочего состояния был наш блок целиком, поэтому виновный модуль
# ищется включением по одному: safeMode = true, потом флаги обратно.
#
# Значения самих флагов режим НЕ трогает — они переживают проверку,
# и возвращать их руками после неё не нужно.
safeMode = false

# Прибор нагрузки главного потока (блок PERF PROBE в claude-custom.js).
#
# Раз в 10 секунд сводит: лаг секундного таймера (насколько занят
# главный поток — показатель, не зависящий от нашего кода), время
# в наших обработчиках с разбивкой по именам, счётчики мутаций и
# размер DOM. Отчёт уходит в hooks-runtime/webview-errors.log
# с `kind: "perf"`.
# Дополнительно: длительные задачи/кадры браузера и функции из их
# атрибуции (если поддерживаются), видимость окна, фокус, память и
# признак работающего локализатора. Текст переписки не записывается.
# interval_sec — фактически прошедшее время, включая задержку таймера.
#
# Молчит, пока всё в порядке: пишет только первый (baseline) отчёт и
# те интервалы, где наши обработчики съели больше 150 мс из 10 секунд
# либо таймер опоздал больше чем на 500 мс.
#
# Зачем: 2026-09-02 вкладка рисовалась через 30–40 с после Reload
# Window, поле ввода моргало и не принимало ввод — при целом бандле,
# без единого исключения в журнале. Главный поток был занят, но чем
# именно, сказать было нечем.
#
# safeMode прибор НЕ гасит: в безопасный режим уходят при поломке,
# и остаться там без измерений — ровно та ситуация, из которой он
# и родился.
perfProbe = true

# Временно измерять число и суммарное время разборов Markdown в штатном
# компоненте расширения. Только вместе с perfProbe, без записи текста.
# При неизвестной версии bundle измеритель не подключается.
# Автоматически снимается после 60 отчётов; изменение — после Reload Window.
perfNativeMarkdown = true

# Независимый процесс измерения ЦП во время задач (нужен Python psutil).
# Запуск UserPromptSubmit, завершение по UI stop; после серверного Stop
# сохраняются ещё до 180 секунд, чтобы захватить задержку отрисовки.
# Записывает общую нагрузку каждого логического процессора, процессы Code
# и наиболее занятые потоки. Текст чата и командные строки не сохраняются.
# Журнал: .claude/hooks-runtime/cpu-usage.jsonl, ротация 8 МБ + одна копия.
# Эти параметры перечитываются без Reload. false останавливает сбор.
cpuProbeEnabled = true
cpuProbeIntervalSec = 2
# Ограничение на случай отсутствия Stop (минуты на одно сообщение).
cpuProbeMaxMinutes = 120

# ==== Кнопки и модули интерфейса ====

# Не разбирать Markdown свёрнутого размышления: заголовок продолжает
# обновляться, полный актуальный текст строится при раскрытии блока.
# false возвращает штатную обработку. safeMode также отключает эту правку.
# Применение после Reload Window; неизвестная версия расширения пропускается.
lazyCollapsedThinking = true

# Минимальный интервал отрисовки растущего Markdown: основной ответ и
# раскрытое размышление. 50 = до двадцати обновлений в секунду на блок.
# Последний фрагмент выводится по таймеру даже без следующих входящих данных.
# Завершение partial-ответа и замена сообщения отображаются сразу.
# 0 отключает объединение обновлений; safeMode также отключает правку.
# Применение после Reload Window. Получение и сохранение текста не замедляются.
markdownRenderIntervalMs = 50

# Показывать незавершённый абзац по мере поступления, не ждать следующего
# абзаца/конца ответа. Убирает штатную выдачу текста целыми абзацами.
# Работает при markdownRenderIntervalMs > 0; false возвращает фильтр абзацев.
# Входящий текст и признак завершения задачи не меняются. Reload Window.
markdownShowPartialParagraph = true

# Во время ответа/раскрытого размышления показывать только слова, после
# которых уже пришёл пробел или перевод строки. Последнее слово целиком
# появляется при завершении потока. Исходный текст не обрезается.
# Вместе с markdownShowPartialParagraph и markdownRenderIntervalMs > 0.
# false возвращает вывод частями слов. Применение после Reload Window.
markdownWholeWords = true

# Показывать поток завершёнными предложениями, а не отдельными словами.
# Имеет приоритет над markdownWholeWords. Точка, !, ? или многоточие
# с последующим пробелом/переносом подтверждают границу; при завершении
# ответа/размышления весь остаток выводится сразу, даже без знака в конце.
# Интервал 50 мс остаётся интервалом проверки/отрисовки. Reload Window.
markdownWholeSentences = true

# Постепенно раскрывать буквы уже завершённых предложений (ответ и размышление).
# Скорость учитывает поступление текста, паузы сервера и запас готовых предложений.
# При завершении или нажатии Стоп весь остаток, включая незавершённое предложение,
# допечатывается не дольше 3 секунд. Скорость при этом повышается минимум на 15%.
# Нижний предел при наличии готового текста — 50 символов/с, верхнего нет.
# Ориентир запаса — 500 готовых символов: избыток ускоряет печать уже во время потока.
# Готовая история при открытии не проигрывается заново.
# true — анимация; false — прежнее появление предложения целиком.
# Требует markdownWholeSentences=true и markdownRenderIntervalMs > 0.
# Не чаще одного кадра за 50 мс; применяется после Reload Window.
# Планирование через requestAnimationFrame; скрытая вкладка сохраняет очередь.
markdownAnimateSentences = true

# Следовать за концом чата при росте отрисованного текста. Прокрутка вверх
# приостанавливает слежение, возврат вниз или кнопка ↓ возобновляют его.
# Работает с отложенным Markdown и раскрытым размышлением. Reload Window.
chatAutoScroll = true

# Клик по пользовательскому сообщению: исходный размер → средний → максимальный → исходный.
# Максимальная ступень только при наличии прокрутки на средней. Клик вне рамки сворачивает.
# Двойной клик сразу раскрывает сообщение до максимальной высоты.
# Show more/less скрыты; обычное выделение текста, ссылки и скролл не переключают высоту.
# Двойной клик по сообщению не выделяет слово.
# Если текст выделен, первый клик по другому месту снимает выделение без сворачивания.
# false возвращает штатные кнопки раскрытия/сворачивания. Применение: Reload Window.
userMessageOutsideCollapse = true

# Максимальная высота текста сообщения в трёх состояниях (px).
# Начальная высота — от 60 px: ниже этого порога штатный компонент не создаёт
# кнопку раскрытия, которую использует обработчик кликов.
# Значения должны строго возрастать: initial < medium < max.
userMessageInitialHeightPx = 80
userMessageMediumHeightPx = 200
userMessageMaxHeightPx = 400

# Кнопка 📁 переноса сессий между проектами (модуль SESSION MOVER).
# Единственный модуль, у которого выключателя раньше не было: без него
# безопасный режим не мог погасить всё.
sessionMover = true

# Конфиг для кастомного JS в webview расширения Claude Code.
#
# Хук .claude/hooks/patch-claude-webview.py читает этот файл через
# `tomllib` (stdlib Python 3.11+) и инлайнит результат в bootstrap
# webview/index.js как `window.__CLAUDE_CUSTOM_CONFIG__`. Изменения
# вступают в силу:
#   - для CSS-related параметров (pollIntervalMs/throttleMs) — после
#     Reload Window или закрытия/открытия панели Claude Code
#     (bootstrap-уровень);
#   - для `logs` — там же (читается при init JS, до Reload не сменится).
#
# Workflow: правишь параметр → новая сессия Claude Code или
# UserPromptSubmit-хук перепишет bootstrap → Reload Window.

# ==== Базовый модуль: язык, логи, CSS, оверлей ====

# Язык локализации интерфейса Claude Code.
# "en" — без локализации (оригинал) и диагностики переводов меню /.
# "ru" — русский (permission-диалоги, настройки расширения, кнопки).
# Переводы хранятся в .claude/patches/locales/<locale>.json.
locale = "en"

# Дата и время отправки под сообщениями пользователя (местное время).
# Берётся из журнала чата по UUID, сохраняется после перезагрузки окна.
userMessageTimestamps = true

# Формат подписи. YYYY — год, MM — месяц, DD — день,
# HH — часы (00–23), mm — минуты, ss — секунды.
# Примеры: "YYYY-MM-DD HH:mm:ss", "DD.MM.YYYY HH:mm", "HH:mm:ss".
# После изменения выполни Developer: Reload Window.
userMessageTimestampFormat = "YYYY-MM-DD HH:mm:ss"

# Формат времени завершения в скобках. При завершении в другой день
# дата добавляется автоматически, если её нет в этом формате.
# Длительность обновляется каждую секунду до остановки обработки.
# Если интерфейс завершил обработку позже Stop-хука, сохраняется более
# позднее время. В подсказке отдельно указано время Stop-хука.
# При зависании webview цифры догоняют реальное время после его оживления.
userMessageCompletionTimeFormat = "HH:mm:ss"

# ==== Расход под сообщениями ====

# Замеры расхода при отправке и завершении сообщения. Для подписки это
# изменение общего счётчика аккаунта; параллельные чаты тоже влияют на него.
# Для API тарифы задаются отдельно в .claude/message-costs.toml.
messageCostsEnabled = true

# Интервал обновления расхода в открытом чате, секунды.
# 0 — только начальный и итоговый замеры. Завершение обновляет расход сразу.
# Рядом с процентом идёт отсчёт до следующего замера; после завершения
# задачи он исчезает. Название окна лимита показывается в подсказке процента.
# Настройки этого раздела перечитываются без перезапуска.
messageCostsRefreshIntervalSec = 30

# Режим оплаты и постоянный НЕСЕКРЕТНЫЙ ID для истории, если мост
# не возвращает ID аккаунта. billing: "subscription" или "api".
# Пример записи: "settings_api.json" = { billing = "api", history_id = "my-api" }.
# Разные аккаунты — разные ID; один аккаунт в разных проектах — одинаковый.
# Ключи API здесь не хранить. Индивидуальные тарифы — в message-costs.toml.
messageCostAccounts = { "settings_zai.json" = { billing = "subscription" } }

# ==== Логи и обновление интерфейса ====

# Включить/выключить console.log + console.warn от инжектируемого JS.
# true — логи `[claude-custom] ...` появляются в Workbench DevTools → Console.
# false — логов нет (тише в проде).
logs = true

# Период периодического пуллинга CSS (мс).
# Каждые pollIntervalMs JS пересоздаёт <link rel="stylesheet"> с
# cache-bust query, чтобы открытые webview-вкладки догоняли изменения
# claude-custom.css даже без DOM-активности. Меньше — быстрее реакция,
# больше — меньше шума в DevTools Sources.
pollIntervalMs = 5000

# Минимальный интервал между двумя обновлениями CSS на DOM-мутациях (мс).
# MutationObserver может стрелять часто во время стриминга ответа;
# throttle защищает от лишних refresh'ей в этом окне.
throttleMs = 200

# Задержка перед догоняющим refresh при активации вкладки (мс).
# Когда переключаешься на ранее неактивную вкладку, JS делает refresh
# через visibilityRefreshDelayMs, а не сразу — это позволяет увидеть,
# как меняется цвет (и убедиться, что хот-релоад действительно работает).
# 0 — refresh мгновенный.
visibilityRefreshDelayMs = 2000

# Включить/выключить отладочное окно в правом верхнем углу webview.
# true — показывает таймер до следующего CSS-poll'а на любой вкладке;
# при visibility-resume переключается в режим обратного отсчёта до
# догоняющего refresh.
# false — overlay не создаётся, никаких таймеров не показывается.
# Буфер печати виден и в свёрнутой панели: шкала и число символов,
# отдельно готовый текст и ожидающий окончания предложения. Обновление 500 мс.
debugOverlay = false

# ==== Проверка связи (📡) ====

# Через сколько секунд без новых данных на странице запускать авто-пинг
# для проверки интернет-соединения. Также через это время рядом со
# спиннером появляется иконка 📡 для ручного пинга. 0 — отключить.
autoPingAfterSilenceSec = 3

# Интервал повторного авто-пинга при отсутствии данных (сек).
# Если данные не поступают дольше autoPingAfterSilenceSec, JS делает
# повторный fetch-пинг каждые pingIntervalSec, чтобы отслеживать
# состояние интернета в реальном времени. 0 — не повторять (один пинг).
pingIntervalSec = 2

# Максимальное количество автоматических пингов за один processing-цикл.
# После достижения лимита повторные пинги прекращаются до следующего
# сообщения. Ручной пинг по 📡 работает всегда, независимо от лимита.
# 0 — без ограничений.
maxPingsPerProcessing = 10

# ==== Редактор прикреплённых изображений ====

# Кнопка ✎ в левом верхнем углу каждой прикреплённой картинки.
# По клику открывает редактор прямо поверх окна чата: кисть, линия,
# прямоугольник и эллипс, выбор цвета и толщины, undo/redo. «Сохранить»
# прикрепляет размеченную PNG-копию в тот же composer и только после
# успешного появления новой миниатюры удаляет исходное вложение.
# false — не добавлять кнопку и редактор.
imageAnnotationEditor = true

# ==== Эмодзи ====

# Кнопка 😀 в футере поля ввода чата (модуль EMOJI PICKER
# в claude-custom.js). По клику открывается панель со смайликами:
# категории, поиск по русским и английским ключевым словам, блок
# «Недавние». Выбранный смайлик вставляется в позицию каретки
# в composer'е — сообщение при этом не отправляется.
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется вообще (никаких DOM-вставок и обработчиков).
emojiPicker = true

# Сколько последних использованных смайликов помнить в блоке «Недавние».
# Хранится в localStorage webview под ключом `claudeCustomEmojiRecent`.
# 0 — блок «Недавние» не показывается и история не ведётся.
emojiRecentLimit = 24

# ==== Починки багов расширения ====

# Чинить пункт меню `/` «Общие настройки…» (модуль SETTINGS MENU FIX
# в claude-custom.js). В расширении 2.1.220 этот пункт зарегистрирован
# с id `slash-command-config`, и ровно такой же id получает слэш-команда
# CLI `/config` (появилась в свежих версиях). Регистрация команды
# перекрывает обработчик пункта, поэтому вместо настроек расширения
# в чат уходит `/config`. Патч перехватывает клик и вызывает
# openConfig() напрямую.
# true — чинить; false — оставить штатное (сломанное) поведение,
# например если Anthropic починит это у себя.
fixSettingsMenuItem = true

# ==== Локальный http-сервер ====

# Журнал локального HTTP-сервера (.claude/hooks-runtime/http-server.log).
# Пишут обе стороны: сам сервер (старт, полученные сигналы, ошибки
# запросов, завершение) и patch-claude-webview.py (почему решил
# перезапустить или погасить). Без второй половины причину остановки
# не определить — в журнале был бы просто обрыв записей.
#
# Формат строки: `2026-08-18 07:40:12.345 [server:12345] сообщение`,
# где 12345 — pid, чтобы различать инстансы.
#
# Посмотреть последние строки: python3 .claude/hooks/hook_log.py 40
#
# true — писать; false — журнал не ведётся вообще.
serverLog = true

# Как часто сервер проверяет конфиг на изменения (сек). 0 — не следить.
#
# Реагирует только на «холодные» параметры — те, что не подтягиваются
# на лету. Горячие (cacheKeepaliveMinutes, cacheKeepaliveMessage,
# cacheKeepaliveMinContext, serverLog, serverLogMaxBytes,
# codexPayloadCapture и сам этот параметр) наблюдатель игнорирует:
# их правка применяется без
# перезапуска, а лишний рестарт — это окно, в котором webview получает
# «недоступен».
#
# Обнаружив правку холодного параметра, сервер сперва пересобирает
# bootstrap webview (иначе перезапуск был бы бессмысленным — эти
# значения живут именно там), потом перезапускает себя через exec.
# Применятся они всё равно только после Developer: Reload Window,
# но к моменту перезагрузки уже будут готовы, без необходимости
# отправлять сообщение в чат.
serverConfigWatchSec = 10

# Порог ротации журнала в байтах. При превышении файл переименовывается
# в http-server.log.1 (предыдущий .1 затирается). Двух поколений хватает:
# журнал нужен для разбора «почему упало только что», а не как архив.
serverLogMaxBytes = 1048576

# ==== Поиск по странице ====

# Кнопка 🔍 рядом с иконкой автосжатия и поиск по переписке
# (модуль FIND IN PAGE в claude-custom.js). По клику или Ctrl+F
# открывается строка поиска: подсветка всех совпадений, переход
# по ним (Enter / Shift+Enter или стрелки), счётчик «текущее/всего»,
# Esc — закрыть.
#
# Подсветка сделана через CSS Custom Highlight API (::highlight()),
# а не обёрткой в <mark>: переписка React-управляемая, вставленные
# элементы слетали бы на ближайшем ре-рендере, а во время стриминга
# ответа он идёт непрерывно. Highlight работает поверх Range и DOM
# не трогает вовсе.
#
# Поле ввода из области поиска исключено намеренно: там текст
# прозрачный, а видимую копию рисует зеркало .mentionMirror_, и
# подсветка в нём выглядела бы как совпадение в пустоте.
#
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется. Если браузерный движок не поддерживает Highlight API,
# модуль тихо выключается сам.
findInPage = true

# Сколько секунд состояние кнопок Cache и ByPass переносится на новую
# сессию. 0 — не переносить вовсе.
#
# Зачем нужно: перезагрузка окна создаёт НОВУЮ сессию, а состояние
# обеих кнопок привязано к session id (у Cache — запись в localStorage,
# у ByPass — marker-файл, который вдобавок удаляет SessionEnd-хук).
# Поэтому после Reload Window кнопки честно оказывались выключенными.
# Теперь последний явный выбор переносится на новую сессию, если он
# сделан не позже buttonStateCarrySec назад.
#
# Почему окно короткое: авто-снятие bypass при закрытии сессии —
# защитное свойство механизма, и превращать его в бессрочное включение
# нельзя. Перезагрузка занимает секунды, так что нескольких минут
# достаточно, а включение вчерашней давности в новом разговоре уже
# не оживёт.
buttonStateCarrySec = 600

# ==== Кэш: панель Usage и поддержание ====

# Кнопка «Usage» в футере поля ввода, слева от «Править автоматически»
# (модуль CACHE USAGE BUTTON в claude-custom.js). По клику открывается
# панель со статистикой prompt-кэша текущей сессии: размер контекста,
# вердикт последнего хода (попадание/промах и пауза до него), суммы
# чтений и записей, оценка стоимости против варианта без кэша и список
# последних 40 строк истории по времени, новые сверху. Одинаковые события
# подряд объединяются в серию с количеством; токены чтения/записи суммируются.
# Другое событие или смена модели разрывает серию. Время строки — её конец,
# диапазон времени показан в подсказке. Для сжатий показан последний замер.
# Клик по серии (или Enter/Пробел) раскрывает отдельные события, новые сверху.
# Промахи показываются и при нулевой записи кэша (OpenAI); для них выводится
# свежий ввод. Промахи после смены модели/аккаунта имеют пояснение в подсказке.
#
# Данные приходят из GET localhost:18923/cache-usage — http-server.py
# разбирает JSONL-транскрипт сессии (модуль .claude/hooks/cache_usage.py).
# Если сервер не поднят, панель честно скажет об этом вместо цифр.
#
# Не путать с соседней кнопкой «Cache» (cacheKeepalive ниже): эта
# показывает статистику, та поддерживает кэш живым.
#
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется вообще (никаких DOM-вставок и запросов к серверу).
usageButton = true

# Кнопка перехода в конец чата справа от панели ввода.
chatScrollBottomButton = true

# Кнопка «Cache» в футере, между Usage и ByPass (модуль CACHE KEEPALIVE
# в claude-custom.js). Включённая — не даёт истечь prompt-кэшу сессии:
# при простое дольше cacheKeepaliveMinutes отправляет в чат короткое
# сообщение, и попадание в кэш продлевает его TTL ещё на час.
#
# Отправка идёт не по таймеру вслепую, а по факту простоя: пока идёт
# обычная работа, кэш продлевается сам, и лишние сообщения — это
# потраченная квота и мусор в истории. Ход пропускается, если в поле
# ввода есть черновик или модель отвечает прямо сейчас.
#
# ВАЖНО: каждое сообщение поддержания — настоящий ход, он расходует
# квоту (чтение кэша ~0.1x от input плюс output ответа) и остаётся
# в истории. Смысл появляется на больших контекстах, где холодный
# старт стоит на порядок дороже.
#
# Сам тоггл по умолчанию выключен и хранится в localStorage по session
# id: у каждой вкладки своё состояние, переживает Reload Window.
#
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется (никаких таймеров и запросов к серверу).
cacheKeepalive = true

# Порог простоя в минутах, после которого отправляется сообщение
# поддержания. Должен быть меньше TTL выбранного провайдера ниже.
# Отсчёт идёт от метки последнего запроса в локальном журнале;
# она не подтверждает точное время обновления серверного кэша.
#
# Этот параметр и два следующих применяются ГОРЯЧО, без Reload Window:
# webview опрашивает GET localhost:18923/custom-config раз в 5 секунд.
# Остальные параметры по-прежнему живут в bootstrap и фиксируются
# на момент загрузки окна.
cacheKeepaliveMinutes = 3

# Текст сообщения поддержания. Чем короче ответ модели, тем дешевле
# ход: тело сообщения почти ничего не стоит, платим за output.
cacheKeepaliveMessage = "keepalive: ничего не делай, ответь одним словом «ок»"

# Резервный TTL в минутах, если у провайдера нет отдельного значения.
# Это локальный порог для Usage, Mood и поддержания, а не настройка API.
# Пауза короче порога не гарантирует попадания, а длиннее не доказывает
# истечения кэша. После порога автоматическое поддержание приостанавливается.
# cacheKeepaliveMinutes должен быть меньше выбранного TTL; иначе JS
# уменьшает порог отправки. Все TTL ниже применяются без Reload Window.
cacheKeepaliveTtlMinutes = 60

# Anthropic: сохраняем прежний порог 60 минут. При другом режиме
# хранения (например, 5 минут) укажи соответствующее значение здесь.
cacheKeepaliveTtlMinutesAnthropic = 60

# OpenAI: 30 минут — минимум хранения после записи или повторного
# использования для GPT-5.6 и новее в Responses API. Кэш может жить дольше.
# Для подписочного Codex это ориентир: мост не подтверждает серверный TTL.
# Для старых моделей/другого режима хранения значение задаётся вручную.
# https://developers.openai.com/api/docs/guides/prompt-caching#cache-lifetime
cacheKeepaliveTtlMinutesOpenai = 30

# Z.ai / GLM: отдельный настраиваемый порог. 60 сохраняет прежнее
# поведение панели и не является заявлением о гарантии провайдера.
cacheKeepaliveTtlMinutesZai = 60

# Остальные пользовательские подключения: резерв для неизвестных моделей.
cacheKeepaliveTtlMinutesCustom = 60

# Минимальный размер контекста (в токенах), с которого кнопку вообще
# можно включить. Ниже порога клик показывает уведомление с текущим
# размером вместо включения.
#
# Откуда взялось значение. Прогрев стоит T × 0.1 × ставка, холодный
# старт — T × (2.0 − 0.1) × ставка, то есть ровно в 19 раз дороже.
# Отношение от T не зависит (сокращается), поэтому порог тут не про
# окупаемость, а про абсолютную величину ставки:
#
#     контекст   холодный старт (Opus 5)   префилл
#        20k              $0.19             ~0.7 с
#        50k              $0.48             ~1.7 с
#       200k              $1.90             ~7 с
#       800k              $7.60             ~27 с
#
# Ниже ~50k предотвращать нечего: полдоллара и две секунды дешевле,
# чем лишнее сообщение в истории и потраченная на него квота.
cacheKeepaliveMinContext = 50000

# ==== ByPass и автозамена ====

# Кнопка «ByPass» в футере, между Cache и «Править автоматически»
# (модуль BYPASS BUTTON в claude-custom.js). Ручной вход в тот же
# режим, который включает слово `да!`: пока он активен, PreToolUse хук
# bypass-check.sh отвечает harness'у permissionDecision=allow, и окна
# подтверждения не появляются.
#
# Механизм общий — marker-файл .claude/hooks-runtime/<session_id>.
# Слово его ставит, кнопка ставит и снимает (через POST /bypass),
# состояние у них одно на двоих. Кнопка при этом единственный способ
# выйти из режима, не закрывая сессию: магическое слово только включает.
#
# Включённый режим кнопка показывает предупреждающим цветом — отключить
# подтверждения и забыть об этом слишком легко.
#
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется (marker не ставится и не снимается, слово `да!` работает
# как раньше).
bypassButton = true

# Автозамена текстовых смайликов прямо при наборе в поле ввода
# (модуль EMOJI AUTOREPLACE в claude-custom.js). Работает независимо
# от emojiPicker. Две формы записи:
#   - классические ASCII-смайлы:  :)  :-D  ;)  <3  xD  8)  \o/
#   - shortcode из каталога:      :rocket:  :bug:  :done:  :fire:
# Замена срабатывает только когда перед смайликом стоит пробел,
# перевод строки или начало текста — поэтому `http://` и `C:/` не
# превращаются в 😕. Откат — обычный Ctrl+Z (замена идёт через
# execCommand и попадает в undo-стек редактора).
# true — заменять; false — модуль не активируется.
emojiAutoReplace = true

# ==== Перехват полного payload Claude Code -> OpenAI ====

# Сохранять полное JSON-тело каждого запроса Claude Code, поступившего в
# локальный Anthropic -> Codex мост. Файлы создаются в
# .claude/hooks-runtime/codex-payloads/ с правами 0600; каталог имеет 0700.
# Заголовки HTTP (включая авторизацию) не сохраняются.
#
# ВАЖНО: payload может содержать системные инструкции, историю диалога,
# содержимое файлов и base64-вложения. Включайте только на время диагностики
# и не публикуйте полученные JSON-файлы. Изменение применяется со следующего
# запроса без перезапуска Claude Code или моста.
# true — сохранять каждый payload; false — не создавать файлы.
codexPayloadCapture = false

# ==== Аккаунты провайдеров ====

# Кнопка «Accs» в футере, слева от Usage (модуль ACCOUNT SWITCHER
# BUTTON в claude-custom.js). По клику открывается список аккаунтов
# ИИ-провайдеров — это settings-файлы в ~/.claude/:
#   settings.json       Anthropic (базовый)
#   settings_glm.json   Z.AI
#   settings_api.json   и любые другие settings_*.json
#   settings_openai.json OpenAI через локальный Codex App Server
# Список собирается сканированием по маске, поэтому добавленный руками
# файл появляется в панели сам, без правки кода.
#
# Подтверждение кнопкой «Переключить аккаунт» подменяет ~/.claude/settings.json копией
# выбранного файла. Оригинал сохраняется в settings.json.bak и
# восстанавливается при возврате на Anthropic; имя активного аккаунта
# лежит в ~/.claude/.active-account. Файловую часть делает
# .claude/hooks/account_switcher.py, webview только ходит в
# GET/POST localhost:18923/accounts.
#
# ВАЖНО: `env` из settings.json читается процессом Claude Code при
# старте сессии, поэтому переключение НЕ действует на текущее окно —
# нужен новый процесс CLI, а он стартует один раз на активацию
# extension host. После подтверждённой смены он перезапускается автоматически.
#
# true — кнопка встраивается в .inputFooter_*; false — модуль не
# активируется (никаких DOM-вставок и запросов к серверу).
accountsButton = true

# «Использовать аккаунт» всегда открывает подтверждение до изменения файлов.
# «Отмена», Escape и клик мимо до подтверждения не меняют аккаунт.
# «Переключить аккаунт» последовательно выполняет смену и перезапуск.
# Старый ключ accountsRestartPrompt больше не используется.
#
# Перезапускается ВЕСЬ extension host, то есть все расширения окна:
# API «перезапустить одно расширение» в VSCode нет. Редакторы, вкладки
# и терминалы при этом остаются — в отличие от Reload Window.

# Полоски расхода лимитов подписки в строке аккаунта Anthropic.
#
# true  — справа от названия аккаунта, работающего на логине claude.ai,
#         рисуются полоски по окнам лимитов: «5 ч» (сессия) и «7 дн»
#         (неделя), у Max к ним добавляются окна по моделям. В подсказке
#         — процент, время до сброса и возраст данных.
# false — строка аккаунта остаётся такой, как была (имя и endpoint).
#
# Полоски получает не «аккаунт по имени Anthropic», а любой, у которого
# в env нет ANTHROPIC_BASE_URL / API_KEY / AUTH_TOKEN: лимиты относятся
# к OAuth-логину Claude Code, а не к settings-файлу. У аккаунта
# стороннего провайдера своих окон нет — там полосок не будет.
#
# Числа берутся из кэша, который ведёт сам Claude Code: он ходит
# в api.anthropic.com/api/oauth/usage и кладёт ответ в ~/.claude.json
# (ключ cachedUsageUtilization), а сервер только читает его файл —
# см. anthropic_usage() в .claude/hooks/account_switcher.py. Своего
# запроса к API мы не делаем: для него нужен OAuth-токен, живущий
# часами, и обновлять его параллельно с CLI значит бороться с ним
# за один и тот же файл ради чисел, которые он и так сохранил.
#
# Отсюда и свежесть: пока сессия идёт через стороннего провайдера,
# обновлять кэш некому. Данные старше получаса показываются
# приглушёнными, точный возраст — в подсказке.
accountsUsageBars = true

# Кэш ответа о лимитах ZAI, секунды: 300 — пять минут.
# 0 — не читать и не обновлять файл кэша (текущее поведение).
# Замеры сообщений и открытие Accs всегда запрашивают свежие данные,
# даже при включённом кэше. Под сообщением ZAI отображается только 5 ч.
# Изменение применяется без перезапуска.
zaiUsageCacheTtlSec = 0

# Фоновый сбор лимитов OpenAI и ZAI, пока работает локальный сервер хуков.
# Не требует открытой вкладки. После последнего замера — пауза в один час;
# при запуске сервера проверяет аккаунты один раз, затем учитывает историю задач.
# Anthropic: сохраняется только доступный кэш при открытии Accs.
# История: ~/.claude/usage-history/quota-periods.sqlite3.
# Зелёный — прирост по замерам задач Claude Code с исходным замером сообщения.
# Источник, ID задачи и этап сохраняются в SQLite вместе с каждым замером.
# Синий — остальные замеры (Accs, фон и история без подтверждённого источника).
# Прирост относится к часу обнаружения; точное время между проверками неизвестно.
# Настройки перечитываются каждые 30 секунд, без перезапуска.
accountUsageBackgroundEnabled = true
accountUsageBackgroundIntervalSec = 3600

# Тариф, почта и срок подписки в списке аккаунтов.
#
# true  — в настройках аккаунта (шестерёнка в строке панели Accs)
#         появляется первый раздел «подписка · срок действия»:
#         доступные для ручного ввода данные подписки. У Anthropic
#         это дата и срок без email; у Z.AI — только email без даты
#         и срока; у прочих сторонних провайдеров доступны все три.
#         В карточке аккаунта тариф и почта стоят
#         припиской к имени, а срок — строкой «до 05.10 · 29 д»:
#         жёлтая, когда до конца меньше недели, красная — когда
#         истекла; точные данные — в подсказке.
# false — раздела в настройках и приписок в списке нет.
#
# Откуда данные: у логина claude.ai тариф и почта — из credentials
# CLI, у ChatGPT — из локального Codex App Server. У Z.AI (api.z.ai)
# тариф и срок берутся из его мониторингового API тем же ключом, что
# лежит в env аккаунта: срок считается до дня следующего списания
# (nextRenewTime), а не до конца контракта в `valid` — оплачен только
# текущий период. Ответ кэшируется на 10 минут в
# .claude/hooks-runtime/zai-subs-cache.json. Почта у прочих сторонних
# провайдеров — только руками. Записи лежат в
# ~/.claude/.account-subs.json
# (ключ — имя settings-файла), а не в самих настройках: те читает
# Claude Code, и служебные ключи в нём были бы риском без выгоды.
accountsSubscription = true

# ==== Индикатор Mood ====

# Индикатор «Mood» в футере, слева от кнопки Accs
# (модуль MOOD GAUGE в claude-custom.js).
#
# Спидометр: полукруглая шкала из четырёх равных секторов —
# красный, оранжевый, жёлтый, зелёный — и стрелка поверх неё.
# Стрелка идёт слева направо: 0 — начало красного, 100 — конец
# зелёного.
#
# Стрелка учитывает ранние промахи: при интервале короче TTL провайдера.
# Промахи за пределами порога не ухудшают эту составляющую Mood.
# Такая классификация не подтверждает срок хранения или причину промаха.
# Считается доля ранних промахов от ходов, где кэш мог сработать:
#
#   потерь нет                    → зелёная зона
#   теряется изредка              → жёлтая
#   теряется на трети-половине    → оранжевая
#   не доживает почти никогда     → красная
#
# Поверх этого действует поправка за размер контекстного окна —
# см. moodContextGoal ниже.
# Если последнее измеренное сжатие освободило меньше 50% максимального
# контекстного окна, стрелка принудительно уходит в красную зону.
# Считается разность «до − после», а не заполненность оставшегося окна.
# Например, при окне 258400 требуется освободить минимум 129200 токенов.
# Красная зона сохраняется до следующего успешного сжатия; незавершённые
# замеры не меняют оценку. Причина и точные числа показаны в подсказке.
#
# Данные берутся из GET localhost:18923/cache-usage (поля early_misses
# и early_chances) — тот же источник, что у панели Usage; сравнением
# пауз с TTL занимается сервер. Пока данных нет, шкала показана серой:
# цветная утверждала бы «всё хорошо», хотя ответа ещё не было.
#
# Значение можно поставить и вручную из консоли webview —
# `window.__claudeMood.set(0..100)`, читается `.get()`, внеочередной
# опрос — `.refresh()`. Это отладочный вход: ближайший опрос перебьёт
# ручное значение своим.
#
# true — индикатор встраивается в .inputFooter_*; false — модуль
# не активируется (никаких DOM-вставок и запросов к серверу).
moodGauge = true

# Отметка, выше которой контекстное окно сессии считается
# раскрывшимся, в токенах.
#
# Сессия, где контекст хотя бы раз поднимался выше этой отметки,
# получает прибавку к оценке (стрелка идёт к зелёному); сессия, так
# и не дотянувшая, — вычет (к красному). Сравнивается пик за всю
# сессию (поле context_peak в /cache-usage), а не текущий контекст:
# компактификация обнуляет окно, и по последнему ходу уже не понять,
# докуда оно доросло.
#
# Поправка фиксированная, около половины сектора шкалы, и главным
# фактором не становится: потери живого кэша важнее того, докуда
# доросло окно. Пока в сессии меньше десяти ходов, поправка вообще
# не применяется — окно свежей сессии не успело вырасти, и вычет
# за это говорил бы о темпе работы, а не о кэше.
moodContextGoal = 250000

# Как часто индикатор Mood опрашивает /cache-usage, в секундах.
# Разбор транскрипта на сервере инкрементальный и дешёвый, но чаще
# раза в несколько секунд смысла нет: метрика меняется не быстрее,
# чем приходят ответы модели.
moodPollSec = 20

# ==== Обводка поля ввода ====

# От чего зависит цвет обводки поля ввода (модуль INPUT RING
# в claude-custom.js). Обводка видна, когда поле в фокусе.
#
# Варианты: mode | mood
#
#   mode — штатное поведение расширения: цвет говорит о режиме
#          разрешений. Оранжевый — обычный, синий — план, серо-белый —
#          «Править автоматически», красный — bypass/auto.
#   mood — цвет сектора, в который сейчас смотрит стрелка индикатора
#          Mood: красный, оранжевый, жёлтый или зелёный.
#
# Зачем второй вариант: Mood стоит в футере и занимает 27×16 точек,
# а рамка обрамляет всё поле ввода — то есть ровно то место, куда
# смотришь, когда пишешь сообщение. Состояние кэша замечаешь, не
# отводя взгляда на индикатор.
#
# Цена — режим разрешений перестаёт быть виден по цвету рамки. Он
# остаётся написан словом в футере («Manual», «Plan», «Править
# автоматически»), но цвет там уже не подсказывает. Поэтому вариант
# и вынесен в настройку, а не включён навсегда.
#
# Красный в двух шкалах означает разное: в режимах — «подтверждений
# не будет», в Mood — «живой кэш теряется почти на каждом ходу».
# Держать оба сразу нельзя (рамка одна), и выбор между ними — это
# выбор, о чём предупреждать чаще.
#
# При mood и выключенном moodGauge (в том числе через safeMode) цвет
# брать неоткуда, и рамка остаётся штатной: значения-то нет.
#
# Параметр горячий — применяется без Reload Window, модуль
# опрашивает GET localhost:18923/custom-config раз в 5 секунд.
inputRingColor = "mood"

# ==== Цитирование ====

# Вставления выделенного текста как цитаты в чат
# (модуль QUOTE FROM SELECTION в claude-custom.js).
# По горячей клавише Ctrl+Shift+Q (Win/Linux) или Cmd+Shift+Q (Mac)
# получает выделенный текст на странице, преобразует его в цитату
# (добавляет `> ` перед каждой строкой) и вставляет в composer.
# Работает как в тексте переписки, так и на других вкладках браузера.
# true — активировать модуль; false — горячая клавиша не работает.
quoteFromSelection = true

# ==== Сигнал сброса 5-часового лимита ====

# Звук .claude/notification.mp3 в момент, когда 5-часовое окно лимита
# claude.ai сбрасывается на 0% — то есть «лимит, в который упёрлись,
# снова доступен», а не при исчерпании. Монитор — daemon-поток
# локального сервера (limit_alert.py), звук играет ffplay.
#
# Данные читаются из кэша ~/.claude.json, который ведёт сам CLI:
# пока сессия на OAuth-логине, он обновляется сам; на стороннем
# провайдере кэш замерзает — но момент сброса в нём абсолютный,
# поэтому сигнал приходит вовремя даже по замёрзшим данным. Наблюдение
# и сигнал работают на любом активном аккаунте: сброса окна claude.ai
# ждут как раз работая на провайдере. Провайдер гасит только повторы —
# кэш claude.ai на нём не обновляется, и повтор звучал бы вечно.
#
# Правило свидетеля: звук звучит только для окна, которое монитор сам
# видел активным. Иначе перезапуск сервера играл бы звук о сбросе,
# случившемся часы назад. Обратная сторона: перезапуск ПОСЛЕ сброса
# пропускает сигнал этого окна.
#
# Все ключи раздела горячие: правка применяется следующим циклом
# монитора, без перезапуска сервера.
limitResetAlert = true

# Каким сбросам окна «5 ч» обязан прозвучать сигнал.
#
# Варианты: any | threshold
#
#   any       — каждый сброс окна, независимо от заполненности.
#   threshold — только если окно перед сбросом было заполнено не
#               меньше limitResetAlertPercent: сигнал означает
#               «лимит, в который упёрлись, снова доступен».
limitResetAlertMode = "threshold"

# Порог заполненности окна перед сбросом для режима threshold,
# в процентах. 95 — узнать о свободном лимите, когда окно было
# заполнено почти целиком; 100 — строго после полного исчерпания.
limitResetAlertPercent = 95

# Как часто монитор перечитывает кэш лимитов, в секундах. Момент
# сброса абсолютный, поэтому сигнал приходит с точностью до этого
# интервала.
limitResetAlertPollSec = 30

# Повтор сигнала, пока окно свободно, в минутах. 0 — один звук на
# сброс. Больше нуля — если новое окно так и не начало тратиться,
# напоминать каждые N минут. Повторы прекращаются сами, как только
# возобновится работа на OAuth-логине.
limitResetAlertRepeatMin = 0

# Сколько секунд проигрывать mp3. 0 — целиком; больше нуля — обрезать
# до N секунд: сигнал, а не музыка.
limitResetAlertPlaySec = 0

# Глушить ли другие источники звука на время уведомления: чужие
# аудио-потоки (музыка, видео) замучиваются до старта сигнала и
# возвращаются после его конца, кнопкой «Стоп» или — если сервер
# умер — по заявке-файлу, которую подберёт следующий старт. Мьют ≠
# пауза: видео продолжит идти без звука. Работает через wpctl
# (WirePlumber); нет его — уведомление просто играет поверх.
limitResetAlertDuckOthers = true

# Минимальная системная громкость на время сигнала, в процентах.
# Если дефолтное устройство тише порога или в мьюте — громкость
# временно поднимается до порога и возвращается после.
# 0 — громкость не трогать.
limitResetAlertMinVolume = 90
